server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: comment-to-ticket-triage
  profiles:
    active: prod
  ai:
    openai:
      api-key: ${HUGGINGFACE_API_TOKEN}
      chat:
        model: meta-llama/Llama-3.3-70B-Instruct:groq
      base-url: https://router.huggingface.co/v1
  jpa:
    hibernate:
      ddl-auto: validate

app:
  data-seeder:
    enabled: true
  admin:
    username: ${APP_ADMIN_USERNAME:admin123}
    password: ${APP_ADMIN_PASSWORD:password}
